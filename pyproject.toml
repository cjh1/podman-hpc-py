[project]
name = "podman-hpc-client"
version = "0.0.1"
description = "Python bindings for Podman HPC RESTful API"
readme = "README.md"
authors = [{ name = "Chris Harris", email = "cjh@lbl.gov" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = ["podman-hpc>=1.1.4", "podman>=5.4.0.1", "pyyaml>=6.0.2"]

[tool.poetry.group.dev.dependencies]
pytest = "*"

[tool.poetry.dependencies]
podman-hpc = "^1.1.4"
podman = "^5.4.0.1"
pyyaml = "^6.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
