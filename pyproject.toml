[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"


[project]
name = "podman-hpc-py"
dynamic = ['version']
dependencies = [
  "podman-hpc==1.1.0",
  "pyyaml",
  "podman"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

requires-python = ">=3.8"
authors = [
  { name="Chris Harris", email="cjh@lbl.gov" },
]
description = "Python bindings for Podman HPC RESTful API"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
  "pytest"
]